# Theses (same fields as papers)
theses:
  - title: "Turning Bad News into Alpha: Passive Exclusion Rules after Goodwill Impairments in the U.S. and Germany, 2005–2025"
    status: "Master's thesis, Frankfurt School of Finance & Management"
    year: 2026
    abstract: >
      This thesis examines whether goodwill impairment announcements have
      persistent capital market implications beyond short-term announcement
      effects and whether such effects matter for passive index investors. Using
      data on DAX and S&P 500 constituents from 2005 to 2025, the study documents
      that firms announcing goodwill impairments exhibit negative abnormal
      performance over medium-term horizons, particularly over twelve months,
      even after excluding the immediate announcement window. Building on this
      evidence, the thesis evaluates simple, rule-based passive exclusion
      strategies. Temporarily removing goodwill-impaired firms from
      index-tracking portfolios and proportionally rescaling remaining
      constituents leads to systematic outperformance relative to the original
      benchmarks, without increasing market risk. In contrast, substituting
      impaired firms with risk-free assets improves risk characteristics but
      does not generate positive alpha. Overall, the results indicate that
      goodwill impairments represent a persistent source of return drag in
      passive indices and that transparent exclusion rules can mitigate this
      effect while preserving the passive nature of index investing.
    links:
      - label: "PDF"
        url: "/files/Elias_Kuebler_MSc_Thesis.pdf"

