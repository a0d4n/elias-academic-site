working_papers: []

work_in_progress:
  - title: "Overlapping Long-Term Incentives and the Lag in Strategic Realignment"
    coauthors: "with Karl Kappen"
    abstract: >
      Executives typically receive a new multi-year long-term incentive (LTI)
      tranche every year, so several tranches with different performance
      criteria are outstanding at the same time. Because existing tranches are
      not rewritten after a strategic change, legacy tranches continue to reward
      the old objectives. We model how these outstanding tranches delay the
      realignment of managerial effort towards a new strategy, a Strategic
      Incentive Lag, and plan to test the predictions using § 162 AktG
      remuneration reports of DAX, MDAX and SDAX firms.

