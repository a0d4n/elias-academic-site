work_in_progress:
  - title: "Overlapping Long-Term Incentives and the Lag in Strategic Realignment"
    coauthors: "with Karl Kappen"
    abstract: >
      Executives receive a new multi-year long-term incentive tranche every
      year, so several tranches with different performance criteria run at the
      same time. When strategy changes, the legacy tranches keep rewarding the
      old goals. We model how this overlap delays the shift of managerial effort
      to the new strategy, a Strategic Incentive Lag, and show in simulations
      that the lag grows with tranche length and with contracting frictions.

theses:
  - title: "Turning Bad News into Alpha: Passive Exclusion Rules after Goodwill Impairments in the U.S. and Germany, 2005–2025"
    coauthors: "Supervised by Dr. María de la O Hervás Zurita and Prof. Dr. Martin Hellmich"
    status: "Master's thesis"
    venue: "Frankfurt School of Finance & Management"
    year: 2026
    abstract: >
      Firms in the DAX and the S&P 500 that announce goodwill impairments
      underperform over the following six to twelve months, beyond the initial
      announcement reaction (2005–2025). A simple passive rule that temporarily
      excludes these firms and rescales the index outperforms the benchmark
      without increasing market risk, while replacing them with risk-free assets
      does not generate alpha.
    links:
      - label: "PDF"
        url: "/files/Elias_Kuebler_MSc_Thesis.pdf"

