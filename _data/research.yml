work_in_progress:
  - title: "Overlapping Long-Term Incentives and the Lag in Strategic Realignment"
    coauthors: "with Karl Kappen"
    question: "How do legacy long-term incentive (LTI) tranches that are still outstanding delay the realignment of managerial effort after a strategic change?"
    literature: "Agency theory and incentive contracting; the duration and vesting of executive pay."
    data: "German remuneration reports under § 162 AktG for DAX, MDAX and SDAX firms around strategic changes (planned)."
    method: "Present-value model of how executives allocate effort across overlapping LTI tranches, with simulations of behavioural and governance frictions."
    findings: "Preliminary simulations: overlapping tranches delay the shift of effort to a new strategy, and the lag grows with tranche length and with frictions such as noisier new performance metrics."

theses:
  - title: "Turning Bad News into Alpha: Passive Exclusion Rules after Goodwill Impairments in the U.S. and Germany, 2005–2025"
    coauthors: "Supervised by Dr. María de la O Hervás Zurita and Prof. Dr. Martin Hellmich"
    status: "Master's thesis"
    venue: "Frankfurt School of Finance & Management"
    year: 2026
    question: "Do goodwill impairment announcements have persistent capital market effects beyond the announcement window, and do these matter for passive index investors?"
    literature: "Market efficiency and long-horizon event studies; goodwill impairment accounting under IAS 36 and U.S. GAAP."
    data: "DAX and S&P 500 constituents, 2005–2025; impairment announcements and returns from Bloomberg, index membership from STOXX and S&P Capital IQ."
    method: "Buy-and-hold abnormal returns over six to twelve months, cross-sectional regressions, and back-tests of rule-based index exclusion strategies."
    findings: "Impaired firms underperform over medium horizons, particularly twelve months. Temporarily excluding them and rescaling the index outperforms the benchmark without increasing market risk, while substituting risk-free assets does not generate alpha."
    links:
      - label: "PDF"
        url: "/files/Elias_Kuebler_MSc_Thesis.pdf"

