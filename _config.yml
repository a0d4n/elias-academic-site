# ==========================================
# ELIAS KÜBLER — ACADEMIC WEBSITE
# ==========================================
# Changes to this file need a fresh build: just commit, and GitHub
# Actions rebuilds the site within about a minute.

# Website
locale: "en-US"
site_theme: "default"
title: "Elias Kübler"
title_separator: "-"
name: "Elias Kübler"
description: "Academic website of Elias Kübler, doctoral candidate at LMU Munich."
og_image: "Elias.jpg"   # picture shown when the site is shared as a link
cv_file: "Elias_Kuebler_CV.pdf"   # CV PDF stored in /files/

# Hosting
# If the repository moves to another account or is renamed, update these
# three lines. For a repository named <username>.github.io, use
#   url: "https://<username>.github.io"  and  baseurl: ""
url: "https://a0d4n.github.io"
baseurl: "/elias-academic-site"
repository: "a0d4n/elias-academic-site"

# ==========================================
# PROFILE SIDEBAR
# ==========================================

author:
  avatar: "Elias.jpg"          # file in /images/
  name: "Elias Kübler"
  bio: "Doctoral Candidate"
  employer: "LMU Munich"
  location: "Munich, Germany"
  uri: "https://www.som.lmu.de/iuc/en/persons/contact-page/elias-kuebler-94d4e20e.html"
  email: "elias.kuebler@lmu.de"
  linkedin: "elias-kuebler"     # the part after linkedin.com/in/

# ==========================================
# WEBSITE CONTENT
# ==========================================

include:
  - _pages
  - files

exclude:
  - .github
  - .devcontainer
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - LICENSE
  - CHANGELOG
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - package.json
  - package-lock.json

# Page formatting
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# ==========================================
# TECHNICAL SETTINGS
# ==========================================

markdown: kramdown
highlighter: rouge
encoding: "utf-8"
timezone: "Europe/Berlin"

atom_feed:
  hide: true

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from
