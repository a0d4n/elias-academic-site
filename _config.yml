
# ==========================================
# ELIAS KÜBLER — ACADEMIC WEBSITE
# ==========================================

# Website
locale: "en-US"
site_theme: "default"
title: "Elias Kübler"
title_separator: "-"
name: "Elias Kübler"
description: "Academic website of Elias Kübler"

# Hosting
url: "https://a0d4n.github.io"
baseurl: "/elias-academic-site"
repository: "a0d4n/elias-academic-site"

# ==========================================
# PROFILE SIDEBAR
# ==========================================

author:
  avatar: "Elias.jpg"
  name: "Elias Kübler"
  bio: "Doctoral Researcher"
  location: "Munich, Germany"
  employer: "LMU Munich"
  uri: "https://www.som.lmu.de/iuc/en/persons/contact-page/elias-kuebler-94d4e20e.html"
  email: "elias.kuebler@lmu.de"
  linkedin: "elias-kuebler"

# ==========================================
# WEBSITE CONTENT
# ==========================================

include:
  - _pages
  - files

exclude:
  - .github
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - CHANGELOG
  - Dockerfile
  - package.json
  - package-lock.json

# Academic content collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Page formatting
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: talks
    values:
      layout: single
      author_profile: true

# ==========================================
# TECHNICAL SETTINGS
# ==========================================

markdown: kramdown
highlighter: rouge
encoding: "utf-8"
timezone: "Europe/Berlin"
permalink: /:categories/:title/

sass:
  sass_dir: _sass
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji
